{% extends "base.html" %}

{% block title %}Create Course - Submitly{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create Course</h1>
    <p>Create a new course for your students.</p>
</div>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Create Course</button>

    <a href="{% url 'courses:course_list' %}">
        Cancel
    </a>
</form>
{% endblock %}
